name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://ymmt2005.github.io/cfgb-example/

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AQUA_ENFORCE_CHECKSUM: "true"
      AQUA_ENFORCE_REQUIRE_CHECKSUM: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ymmt2005/cfgb-action@316e6d0fef51dd0887516fcbb17778c85fda5be1 # v0.3.0
        id: cfgb
        with:
          cfgb-version: v0.4.0
          package-manager: npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ steps.cfgb.outputs.node-version }}
      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-cfgb-${{ steps.cfgb.outputs.cfgb-version }}-node-${{ steps.cfgb.outputs.node-version }}-npm-${{ steps.cfgb.outputs.npm-version }}
      - name: Install the tested npm version
        env:
          NPM_VERSION: ${{ steps.cfgb.outputs.npm-version }}
        run: npm install --global "npm@$NPM_VERSION"
      - name: Build static site at the Pages project path
        run: cfgb build --force --out dist --static --base-url "$SITE_URL"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ymmt2005/cfgb
          ref: v0.4.0
          path: cfgb-link-tools
          sparse-checkout: scripts
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e
        with:
          aqua_version: v2.63.0
          aqua_opts: ""
      - run: git diff --exit-code -- aqua-checksums.json
      - name: Check generated links before publication
        run: node cfgb-link-tools/scripts/check-links.mjs dist/site "$SITE_URL" --config .github/lychee.toml
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deploy
